name: Git Constellation

on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours (UTC); edit to change the schedule
  workflow_dispatch:

permissions:
  contents: write # lets the automatic GITHUB_TOKEN push the image branch

concurrency:
  group: git-constellation
  cancel-in-progress: false

jobs:
  constellation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false # the action passes the token only to its own push
      - uses: Camiiilotaba/git-constellation@develop
        with:
          name: Camilo Taba
          role: Full-Stack Developer
          stack: Laravel / PHP
          languages: '["PHP", "TypeScript", "JavaScript", {"name": "Dart", "color": "#00b4ab"}, {"name": "SQL", "color": "#e38c00"}]'
          # Optional: a classic token with only read:user adds private contribution counts.
          token: ${{ secrets.CONSTELLATION_TOKEN }}
